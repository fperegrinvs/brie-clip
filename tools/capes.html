<!doctype html><meta charset="utf-8"><style>@font-face{font-family:Fredoka;src:url(../fonts/Fredoka.ttf)}</style><body style="margin:0"><canvas id="c" width="1920" height="1640"></canvas>
<script type="module">
import { drawBreeSide, setCapeStyle } from '../src/bree.js';
const ctx = document.getElementById('c').getContext('2d');
await document.fonts.load('40px Fredoka');
const OPTS = [
  ['A · Tucked under the ears, lies on the back', 'strap'],
  ['B · Flies up high off the back', 'fly'],
  ['C · Drapes over the back like a blanket', 'drape'],
  ['D · Royal: longer, gold-trimmed hem', 'royal'],
];
const BG = ['#d8f0c8', '#cfe6ff', '#ffe9c2', '#efe0ff'];
const TS = [0.0, 0.18, 0.36];
OPTS.forEach(([label, st], r) => {
  const cy = r * 410;
  ctx.fillStyle = BG[r]; ctx.fillRect(0, cy, 1920, 410);
  setCapeStyle(st);
  TS.forEach((t, i) => {
    ctx.save(); ctx.translate(420 + i * 600, cy + 385); ctx.scale(1.0, 1.0);
    drawBreeSide(ctx, { cape: { t: 200 + t }, crown: i === 2, phase: ((200 + t) * 2.2) % 1, amp: 1, eyes: 'happy', mouth: 0.7, ear: 0.8, wag: (200 + t) * 18 });
    ctx.restore();
  });
  ctx.fillStyle = '#3a2747'; ctx.font = '600 42px Fredoka'; ctx.fillText(label, 24, cy + 52);
  ctx.strokeStyle = '#3a2747'; ctx.lineWidth = 4; ctx.strokeRect(0, cy, 1920, 410);
});
window.done = true;
</script>
